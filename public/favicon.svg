<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#1a6b8a"/>
      <stop offset="0.55" stop-color="#124e72"/>
      <stop offset="1"    stop-color="#0a2e52"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="500" height="500" rx="108" fill="url(#bg)"/>

  <!-- Subtle top-left highlight -->
  <path d="M55 90C55 44 97 22 150 22H340C410 22 462 68 462 135V162C335 116 178 122 55 185V90Z"
        fill="#FFFFFF" opacity="0.08"/>

  <!-- 5 staff lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.80" stroke-width="10" stroke-linecap="round">
    <line x1="72" y1="195" x2="428" y2="195"/>
    <line x1="72" y1="225" x2="428" y2="225"/>
    <line x1="72" y1="255" x2="428" y2="255"/>
    <line x1="72" y1="285" x2="428" y2="285"/>
    <line x1="72" y1="315" x2="428" y2="315"/>
  </g>

  <!-- Note 1 — on 2nd line from bottom (y=285), stem up -->
  <ellipse cx="152" cy="285" rx="27" ry="19"
           fill="white" transform="rotate(-18 152 285)"/>
  <rect x="176" y="173" width="8" height="114"
        fill="white" rx="3"/>

  <!-- Note 2 — on 2nd line from top (y=225), stem up -->
  <ellipse cx="322" cy="225" rx="27" ry="19"
           fill="white" transform="rotate(-18 322 225)"/>
  <rect x="346" y="113" width="8" height="114"
        fill="white" rx="3"/>
</svg>
